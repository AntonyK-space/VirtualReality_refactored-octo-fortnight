<html>
  <head>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-box wireframe=true class="car" position="0 1.25 0" >
          <a-box wireframe=true class="body">
              <a-box color="grey" position="0 .75 -1.25" width="2.5" height="1.25"></a-box>
              <a-box color="grey" position="0 1.5 -.25" width="2.5" height=".5" depth="3"></a-box>
              <a-box color="grey" position="0 .75 .75" width="2.5" height="1.25"></a-box>
              <a-box position="0 -.25 0" depth="5" width="2.5" height=".75" color="gray"></a-box>
          </a-box>
          <a-plane></a-plane>
          <a-box wireframe=true class="tires" position="0 -1.125 0">
              <a-box class="tire" position="-1.25 .45 1.75" wireframe=true>
                  <a-cylinder rotation="90 90 0" radius=".5" height=".25" color="black"></a-cylinder>
              </a-box>
              <a-box class="tire" position="-1.25 .45 -1.75" wireframe=true>
                  <a-cylinder rotation="90 90 0" radius=".5" height=".25" color="black"></a-cylinder>
              </a-box>
              <a-box class="tire" position="1.25 .45 1.75" wireframe=true>
                  <a-cylinder rotation="90 90 0" radius=".5" height=".25" color="black"></a-cylinder>
              </a-box>
              <a-box class="tire" position="1.25 .45 -1.75" wireframe=true>
                  <a-cylinder rotation="90 90 0" radius=".5" height=".25" color="black"></a-cylinder>
              </a-box>
          </a-box>
      </a-box>

      <a-plane position="0 0 0" rotation="-90 0 0" width="10" depth="10" height="10" color="#7BC8A4"></a-plane>
      <a-sky color="#ECECEC"></a-sky>
      <a-camera position="2.5 1 -2.5" rotation="0 90 0"></a-camera>
    </a-scene>
  </body>
</html>
